<!-- الطبقة الشفافة خلف القائمة (للكمبيوتر) -->

    <div id="#tasbeeh-section" class="tasbeeh-container">
        <h2 class="tasbeeh-title" data-ar="📿 السبحة الإلكترونية" data-en="📿 Digital Tasbeeh">📿 السبحة الإلكترونية
        </h2>

        <!-- قائمة اختيار الذكر -->
        <select id="tasbeehSelect" class="tasbeeh-select" onchange="changeZikr()">
            <option value="سبحان الله">سبحان الله</option>
            <option value="الحمد لله">الحمد لله</option>
            <option value="لا إله إلا الله">لا إله إلا الله</option>
            <option value="الله أكبر">الله أكبر</option>
            <option value="أستغفر الله العظيم">أستغفر الله العظيم</option>
            <option value="لا حول ولا قوة إلا بالله">لا حول ولا قوة إلا بالله</option>
            <option value="اللهم صلِّ وسلم على نبينا محمد">اللهم صلِّ وسلم على نبينا محمد</option>
        </select>

        <!-- شاشة العداد -->
        <div class="counter-display">
            <span id="counterValue">0</span>
        </div>

        <!-- الأزرار -->
        <div class="tasbeeh-actions">
            <!-- زر التسبيح الكبير -->
            <button class="tasbeeh-btn" onclick="incrementCounter()" data-ar="سبِّح" data-en="Tasbeeh">سبِّح</button>
            <!-- زر إعادة الضبط -->
            <button class="reset-btn" onclick="resetCounter()" title="إعادة الضبط" data-ar="🔄 صفر"
                data-en="🔄 Reset">🔄 صفر</button>
        </div>
    </div>
